[project]
name = "mynav-routing"
version = "0.3.1"
description = "Moteur de routage météo (isochrones) pour MyNavApp - polaires, GRIB, open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
grib = ["xarray>=2024.1", "cfgrib>=0.9.10", "eccodes>=2.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mynav_routing"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "RUF"]
