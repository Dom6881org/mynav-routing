name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_routing_benchmark:
        description: Run the Saint-Cyprien → Ajaccio benchmark
        required: false
        default: false
        type: boolean
      run_routing_acceptance:
        description: Run the real-route acceptance matrix (Cap Béar, Cap de Creus, Calvi)
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests --output-format=github
      - name: Tests
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' pytest.log | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
            tail -c 1500 pytest.log | tr '\n' '¦' | sed 's/¦/ \/ /g' | while IFS= read -r line; do
              echo "::error title=pytest-log::$line"
            done
          fi
          exit $code
  routing-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_routing_benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Benchmark Saint-Cyprien → Ajaccio
        run: pytest -o addopts= -m slow tests/test_perf_stcyprien.py -s

  routing-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_routing_acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acceptance matrix (routes réelles × vents)
        run: pytest -o addopts= -m slow tests/test_acceptance.py -s
